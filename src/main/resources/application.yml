server:
  port: 8080

spring:
  application:
    name: finance-rag-assistant
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

finance-rag:
  ollama:
    base-url: http://localhost:11434
    chat-model: llama3.2
    embedding-model: nomic-embed-text
  ingestion:
    chunk-size: 800       # characters per chunk
    chunk-overlap: 100    # character overlap between consecutive chunks
  retrieval:
    top-k: 4              # number of chunks retrieved per question
    min-score: 0.5        # cosine-similarity floor; chunks below this are discarded
  vector-store:
    persist-path: ./data/vector-store.json
