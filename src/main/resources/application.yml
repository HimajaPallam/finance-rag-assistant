server:
  port: 8080

spring:
  application:
    name: finance-rag-assistant
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

# ---------------------------------------------------------------------------
# RAG configuration. Everything here runs 100% locally via Ollama - no API
# keys, no paid services. Install Ollama from https://ollama.com/download and
# pull the two models below before starting this app:
#
#   ollama pull llama3.2          (generation model, ~2GB, use llama3.2:1b
#                                   if your laptop has < 8GB RAM)
#   ollama pull nomic-embed-text  (embedding model, ~270MB)
# ---------------------------------------------------------------------------
finance-rag:
  ollama:
    base-url: http://localhost:11434
    chat-model: llama3.2
    embedding-model: nomic-embed-text
  ingestion:
    chunk-size: 800       # characters per chunk
    chunk-overlap: 100    # character overlap between consecutive chunks
  retrieval:
    top-k: 4              # number of chunks retrieved per question
    min-score: 0.5        # cosine-similarity floor; chunks below this are discarded
  vector-store:
    persist-path: ./data/vector-store.json
